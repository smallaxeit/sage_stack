name: CI

on:
  push:
    branches: [main, developmentlv]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The store parity suite runs the same contract against the files driver
    # and Postgres; without a database it quietly covers only half of it.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sage
          POSTGRES_PASSWORD: sage
          POSTGRES_DB: sagestack
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://sage:sage@localhost:5432/sagestack

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Enable pgvector
        run: psql "$TEST_DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Test
        run: npm test

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client
